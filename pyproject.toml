[project]
name = "clockwork"
version = "0.7.1"
description = "Toolkit for time-related operations including scheduling, logging, date manipulation, and more."
authors = [
    { name = "Zachary Einck", email = "zacharyeinck@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.106",
    "numpy>=2.5.4",
    "oddments>=0.10.1",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "python-dateutil>=2.9.0.post0",
    "schedule>=1.2.2",
]

[project.urls]
repository = "https://github.com/zteinck/clockwork"
homepage = "https://github.com/zteinck/clockwork"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
